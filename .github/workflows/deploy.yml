name: Deploy - Lambda Function

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "hml"
        type: choice
        options:
          - hml
          - prd

permissions:
  contents: read

jobs:
  deploy:
    name: "Deploy - Lambda Function"
    runs-on: ubuntu-latest
    environment: aws
    env:
      ENVIRONMENT: ${{ inputs.environment || vars.environment }}
      LAMBDA_FUNCTION_NAME: mechermes-${{ inputs.environment }}-cognito-token-lambda

    defaults:
      run:
        working-directory: ./CognitoTokenLambda
        shell: bash

    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout
        uses: actions/checkout@v6

      # Setup .NET 10
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Install Lambda deployment tools
      - name: Install Amazon Lambda Tools
        run: dotnet tool install -g Amazon.Lambda.Tools

      # Configure AWS Credentials for AWS CLI and other AWS SDKs and tools
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      # Discover infrastructure values from AWS
      - name: Discover AWS Infrastructure Values
        id: discover
        run: |
          echo "Discovering RDS endpoint for environment: ${{ inputs.environment }}"
          RDS_ENDPOINT=$(aws rds describe-db-instances \
            --db-instance-identifier mechermes-${{ inputs.environment }}-rds \
            --query "DBInstances[0].Endpoint.Address" \
            --output text)
          echo "RDS_ENDPOINT=$RDS_ENDPOINT" >> $GITHUB_OUTPUT
          echo "✓ RDS Endpoint discovered: $RDS_ENDPOINT"

          echo "Discovering RDS port"
          RDS_PORT=$(aws rds describe-db-instances \
            --db-instance-identifier mechermes-${{ inputs.environment }}-rds \
            --query "DBInstances[0].Endpoint.Port" \
            --output text)
          echo "RDS_PORT=$RDS_PORT" >> $GITHUB_OUTPUT
          echo "✓ RDS Port discovered: $RDS_PORT"

          echo "Discovering Lambda security group"
          LAMBDA_SG=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=mechermes-lambda-sg" \
            --query "SecurityGroups[0].GroupId" \
            --output text)
          echo "LAMBDA_SG=$LAMBDA_SG" >> $GITHUB_OUTPUT
          echo "✓ Lambda Security Group discovered: $LAMBDA_SG"

          echo "Discovering VPC private subnets"
          SUBNET_IDS=$(aws ec2 describe-subnets \
            --filters "Name=tag:Name,Values=mechermes-vpc-private-*" \
            --query "Subnets[*].SubnetId" \
            --output text | tr '\t' ',')
          echo "SUBNET_IDS=$SUBNET_IDS" >> $GITHUB_OUTPUT
          echo "✓ Private Subnets discovered: $SUBNET_IDS"

          echo "Discovering Cognito User Pool ID"
          USER_POOL_ID=$(aws cognito-idp list-user-pools --max-results 60 \
            --query "UserPools[?Name=='mechermes-${{ inputs.environment }}-userpool'].Id | [0]" \
            --output text)
          echo "USER_POOL_ID=$USER_POOL_ID" >> $GITHUB_OUTPUT
          echo "✓ Cognito User Pool ID discovered: $USER_POOL_ID"

          echo "Discovering Cognito secret from Secrets Manager"
          COGNITO_SECRET_ID=$(aws secretsmanager list-secrets \
            --filters "Key=name,Values=mechermes-${{ inputs.environment }}-cognito-client-secret" \
            --query "SecretList[0].Name" \
            --output text)
          echo "COGNITO_SECRET_ID=$COGNITO_SECRET_ID" >> $GITHUB_OUTPUT
          echo "✓ Cognito Secret ID discovered: $COGNITO_SECRET_ID"

      # Build and package Lambda function
      - name: Build Lambda Package
        run: |
          echo "Building Lambda function for ${{ inputs.environment }} environment"
          dotnet publish -c Release -r linux-x64 --self-contained false
          echo "✓ Lambda package built successfully"

      # Deploy Lambda function using AWS Lambda Tools
      - name: Deploy Lambda Function
        run: |
          echo "Deploying Lambda function: ${{ env.LAMBDA_FUNCTION_NAME }}"

          # Check if function exists
          if aws lambda get-function --function-name ${{ env.LAMBDA_FUNCTION_NAME }} 2>/dev/null; then
            echo "Function exists, updating code and configuration..."
            
            # Update function code
            dotnet lambda deploy-function ${{ env.LAMBDA_FUNCTION_NAME }} \
              --function-role ${{ vars.LAMBDA_EXECUTION_ROLE_ARN }} \
              --disable-interactive true
            
            echo "✓ Lambda function code updated"
          else
            echo "Function does not exist, creating new function..."
            
            # Create new function
            dotnet lambda deploy-function ${{ env.LAMBDA_FUNCTION_NAME }} \
              --function-role ${{ vars.LAMBDA_EXECUTION_ROLE_ARN }} \
              --disable-interactive true
            
            echo "✓ Lambda function created"
          fi

      # Create/Update Cognito Secret with DB Password
      - name: Create/Update Cognito Secret
        run: |
          echo "Creating/updating Cognito secret for ${{ inputs.environment }}"
          
          # Discover RDS password
          DB_ARN=$(aws rds describe-db-instances \
            --db-instance-identifier mechermes-${{ inputs.environment }}-rds \
            --query "DBInstances[0].MasterUserSecret.SecretArn" \
            --output text)
          DB_PASSWORD=$(aws secretsmanager get-secret-value \
            --secret-id "$DB_ARN" \
            --query SecretString \
            --output text | jq -r '.password')
          
          # Discover Cognito User Pool ID
          USER_POOL_ID=$(aws cognito-idp list-user-pools \
            --max-results 60 \
            --query "UserPools[?Name=='mechermes-${{ inputs.environment }}-userpool'].Id" \
            --output text)
          echo "User Pool ID: $USER_POOL_ID"
          
          # Discover Cognito App Client ID
          CLIENT_ID=$(aws cognito-idp list-user-pool-clients \
            --user-pool-id "$USER_POOL_ID" \
            --query "UserPoolClients[?ClientName=='mechermes-${{ inputs.environment }}-client'].ClientId" \
            --output text)
          echo "Client ID: $CLIENT_ID"
          
          # Discover Cognito App Client Secret
          CLIENT_SECRET=$(aws cognito-idp describe-user-pool-client \
            --user-pool-id "$USER_POOL_ID" \
            --client-id "$CLIENT_ID" \
            --query "UserPoolClient.ClientSecret" \
            --output text)
          echo "Client Secret discovered (hidden)"
          
          # Discover Cognito Domain
          COGNITO_DOMAIN=$(aws cognito-idp describe-user-pool \
            --user-pool-id "$USER_POOL_ID" \
            --query "UserPool.Domain" \
            --output text)
          
          # Construct full domain URL
          if [ "$COGNITO_DOMAIN" != "None" ] && [ -n "$COGNITO_DOMAIN" ]; then
            DOMAIN_URL="https://$COGNITO_DOMAIN.auth.${{ vars.AWS_DEFAULT_REGION }}.amazoncognito.com"
          else
            echo "Warning: No Cognito domain found, using User Pool ID format"
            DOMAIN_URL="https://${{ vars.AWS_DEFAULT_REGION }}_${USER_POOL_ID}.auth.${{ vars.AWS_DEFAULT_REGION }}.amazoncognito.com"
          fi
          echo "Domain URL: $DOMAIN_URL"
          
          # Create secret JSON with Cognito credentials and DB password
          SECRET_VALUE=$(cat <<EOF
          {
            "client_id": "$CLIENT_ID",
            "client_secret": "$CLIENT_SECRET",
            "domain": "$DOMAIN_URL",
            "scope": "mechermes/client",
            "db_password": "$DB_PASSWORD"
          }
          EOF
          )
          
          SECRET_NAME="mechermes-${{ inputs.environment }}-cognito-client-secret"
          
          # Check if secret exists
          if aws secretsmanager describe-secret --secret-id "$SECRET_NAME" 2>/dev/null; then
            echo "Secret exists, updating..."
            aws secretsmanager update-secret \
              --secret-id "$SECRET_NAME" \
              --secret-string "$SECRET_VALUE"
            echo "✓ Secret updated: $SECRET_NAME"
          else
            echo "Secret does not exist, creating..."
            aws secretsmanager create-secret \
              --name "$SECRET_NAME" \
              --description "Cognito credentials and DB password for Lambda - ${{ inputs.environment }}" \
              --secret-string "$SECRET_VALUE"
            echo "✓ Secret created: $SECRET_NAME"
          fi

      # Update Lambda environment variables with discovered values
      - name: Update Lambda Environment Variables
        run: |
          echo "Updating Lambda environment variables for ${{ env.LAMBDA_FUNCTION_NAME }}"

          # Discover RDS configuration
          RDS_ENDPOINT=$(aws rds describe-db-instances \
            --db-instance-identifier mechermes-${{ inputs.environment }}-rds \
            --query "DBInstances[0].Endpoint.Address" \
            --output text)
          RDS_PORT=$(aws rds describe-db-instances \
            --db-instance-identifier mechermes-${{ inputs.environment }}-rds \
            --query "DBInstances[0].Endpoint.Port" \
            --output text)
          
          # Fixed Cognito Secret ID
          COGNITO_SECRET_ID="mechermes-${{ inputs.environment }}-cognito-client-secret"

          # Update Lambda environment variables
          aws lambda update-function-configuration \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --environment "Variables={RDS__Host=$RDS_ENDPOINT,RDS__Port=$RDS_PORT,RDS__Database=mechermesdb,RDS__Username=postgres,COGNITO_SECRET_ID=$COGNITO_SECRET_ID,EmailSender__Enabled=true,EmailSender__SmtpServer=smtp.gmail.com,EmailSender__SmtpPort=465,EmailSender__SslRequired=true,EmailSender__UserName=${{ secrets.EMAIL_USERNAME }},EmailSender__Password=${{ secrets.EMAIL_PASSWORD }},EmailSender__SenderInformation__Name=Mecânica Hermes,EmailSender__SenderInformation__Address=rogeriosoftplan@gmail.com}" \
            --region ${{ vars.AWS_DEFAULT_REGION }}

          echo "✓ Environment variables updated successfully"
          
          # Wait for the Lambda function to finish updating before proceeding
          echo "Waiting for Lambda function update to complete..."
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --region ${{ vars.AWS_DEFAULT_REGION }}
          
          echo "✓ Lambda function update completed"

      # Configure Lambda VPC settings
      - name: Configure Lambda VPC
        run: |
          echo "Configuring Lambda VPC settings for RDS access"

          aws lambda update-function-configuration \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --vpc-config "SubnetIds=${{ steps.discover.outputs.SUBNET_IDS }},SecurityGroupIds=${{ steps.discover.outputs.LAMBDA_SG }}" \
            --region ${{ vars.AWS_DEFAULT_REGION }}

          echo "✓ Lambda VPC configuration updated"
          echo "  - Security Group: ${{ steps.discover.outputs.LAMBDA_SG }}"
          echo "  - Subnets: ${{ steps.discover.outputs.SUBNET_IDS }}"

          # Wait for VPC configuration to be applied
          echo "Waiting for VPC configuration to be applied..."
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --region ${{ vars.AWS_DEFAULT_REGION }}
          echo "✓ VPC configuration applied successfully"

      # Configure API Gateway Permissions
      - name: Configure API Gateway Permissions
        run: |
          echo "Configuring API Gateway permissions for Lambda invocation..."
          
          # Discover API Gateway ID for the environment
          API_GATEWAY_ID=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='mechermes-${{ inputs.environment }}-api'].ApiId" \
            --output text)
          
          if [ -z "$API_GATEWAY_ID" ] || [ "$API_GATEWAY_ID" == "None" ]; then
            echo "⚠️  Warning: API Gateway not found for environment ${{ inputs.environment }}"
            echo "Skipping permission configuration. Run API Gateway deployment first."
          else
            echo "✓ API Gateway ID: $API_GATEWAY_ID"
            
            # Remove existing permission if it exists (to avoid conflicts)
            echo "Removing existing API Gateway permission (if any)..."
            aws lambda remove-permission \
              --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
              --statement-id "AllowExecutionFromAPIGateway-${{ inputs.environment }}" \
              --region ${{ vars.AWS_DEFAULT_REGION }} 2>/dev/null || echo "No existing permission to remove"
            
            # Add permission for API Gateway to invoke Lambda
            echo "Adding API Gateway invoke permission..."
            aws lambda add-permission \
              --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
              --statement-id "AllowExecutionFromAPIGateway-${{ inputs.environment }}" \
              --action lambda:InvokeFunction \
              --principal apigateway.amazonaws.com \
              --source-arn "arn:aws:execute-api:${{ vars.AWS_DEFAULT_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:${API_GATEWAY_ID}/*/*/auth/generate-token" \
              --region ${{ vars.AWS_DEFAULT_REGION }}
            
            echo "✓ API Gateway permission configured successfully"
            echo "  - API Gateway ID: $API_GATEWAY_ID"
            echo "  - Route: POST /auth/generate-token"
          fi

      # Verify deployment
      - name: Verify Deployment
        run: |
          echo "Verifying Lambda deployment..."

          FUNCTION_INFO=$(aws lambda get-function \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --region ${{ vars.AWS_DEFAULT_REGION }})

          echo "✓ Lambda Function Details:"
          echo "$FUNCTION_INFO" | jq -r '.Configuration | {
            FunctionName,
            Runtime,
            MemorySize,
            Timeout,
            LastModified,
            State,
            Version
          }'

          echo ""
          echo "✓ Lambda function deployed and verified successfully"
          echo "Function ARN: $(echo "$FUNCTION_INFO" | jq -r '.Configuration.FunctionArn')"
          
          # Display Lambda permissions
          echo ""
          echo "Lambda Permissions:"
          aws lambda get-policy \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --region ${{ vars.AWS_DEFAULT_REGION }} \
            --query 'Policy' \
            --output text | jq -r '.Statement[] | "  - \(.Sid): \(.Principal.Service) can invoke from \(.Condition.ArnLike."AWS:SourceArn")"' || echo "  No permissions configured"
